<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Apply key · transition options</title>
<style>
:root{font-family:Inter,'Segoe UI',sans-serif;color:#ececf2;--ink:#ececf2;--quiet:#a6a7b3;--line:#303139;--surface:#15161c;--canvas:#0e0f15;--accent:#8589ed;--red:#ff8298;--green:#49d79e;--radius:8px}
*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--foreground,#23232f);font-size:13px}button,input,select{font:inherit}button,select{cursor:pointer}button{border:1px solid var(--line);border-radius:6px;background:#202129;color:var(--ink);padding:8px 12px;min-height:36px}button:hover:not(:disabled){background:#2b2c38}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{cursor:default}select{background:#202129;color:var(--ink);border:1px solid var(--line);border-radius:5px;min-height:36px;padding:5px 8px;max-width:100%}.options{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.options button{flex:1;white-space:nowrap;min-width:140px}.options button[aria-pressed=true]{border-color:var(--accent);background:#282844}.options small{font-size:10px;margin-left:4px;color:#b5b7ff}.description{margin:0 0 14px;line-height:1.6;min-height:42px;color:var(--muted-foreground,#646473)}.controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}.controls label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground,#646473)}.workbench{background:var(--canvas);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden}.mock-heading{font-size:15px;line-height:24px;font-weight:600;margin:0 0 15px}.sources{display:grid;grid-template-columns:1fr 20px 1fr;gap:12px;align-items:center;margin-bottom:18px}.source{display:flex;gap:10px;min-width:0;align-items:center}.source svg{width:16px;flex:none;fill:none;stroke:var(--quiet);stroke-width:1.5}.source strong{display:block;font-size:12px;overflow-wrap:anywhere}.source small{display:block;margin-top:4px;color:var(--red);font-size:11px}.source.candidate small{color:var(--green)}.arrow{color:var(--quiet)}.content{min-height:350px;position:relative}.editor{border:1px solid var(--line);border-radius:8px;margin:0;padding:12px;background:var(--surface)}legend{font-weight:600;padding:0 4px}.columns{display:flex;gap:10px 14px;flex-wrap:wrap;font-size:12px}.columns label{display:flex;align-items:center;gap:5px}.columns input{margin:0;accent-color:#99c4f1}.key-order{display:flex;align-items:center;gap:9px;margin:14px 0 12px}.key-order small{font-size:10px;color:var(--quiet)}code{font-family:'Cascadia Mono',Consolas,monospace}.key-chip{display:inline-block;border:1px solid var(--line);background:var(--canvas);padding:5px 8px;border-radius:5px;font-size:12px}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;min-height:36px}.primary{background:var(--accent);color:#101124;border-color:var(--accent);font-weight:600;min-width:92px}.primary:hover:not(:disabled){background:#999cf4}.primary:disabled{background:var(--accent);color:#15162c}.inline-progress{display:inline-flex;align-items:center;gap:7px;color:var(--quiet);font-size:12px}.cancel{background:transparent;font-size:12px;min-height:30px;padding:4px 8px}.intro,.stage{display:grid;place-content:center;text-align:center;min-height:210px;padding:22px;gap:10px}.intro svg{width:28px;height:28px;fill:none;stroke:var(--quiet);stroke-width:1.5;margin:auto}.intro h3,.stage h3{font-size:16px;margin:0}.intro p,.stage p{font-size:12px;color:var(--quiet);line-height:1.7;max-width:380px;margin:0 auto}.spinner{width:14px;height:14px;display:inline-block;border:2px solid #646789;border-top-color:#a9acff;border-radius:50%;animation:spin .8s linear infinite;flex:none}.stage .spinner{width:28px;height:28px;margin:auto}.banner{padding:8px 10px;background:#1b2038;border-block:1px solid #353e64;margin:10px -16px 0;display:flex;align-items:center;gap:8px;color:#bfc4fa}.banner .cancel{margin-left:auto}.match{display:flex;align-items:center;gap:8px;min-height:36px;font-size:12px;margin-bottom:13px}.match .quiet{color:var(--quiet)}.unique{margin-left:auto;color:var(--quiet);font-size:11px}.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}.badge{display:inline-flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:5px;font-size:11px;min-height:30px;background:var(--surface)}.badge:first-child{border-color:#6c6fb5;background:#292943}.badge b{font-weight:600}.viewbar{display:flex;gap:12px;color:var(--quiet);padding-bottom:10px;border-bottom:1px solid var(--line);font-size:11px}.viewbar strong{color:var(--ink)}.inspector{display:grid;grid-template-columns:140px 1fr;min-height:205px}.rowlist{background:var(--surface);border-right:1px solid var(--line);padding:12px}.row-choice{border:1px solid #535485;background:#26263c;padding:10px;border-radius:6px}.row-choice strong{display:block;font-size:12px}.row-choice small{color:var(--quiet);font-size:11px;display:block;margin-top:6px}.detail{padding:14px;min-width:0}.detailhead{display:flex;gap:8px;align-items:center;margin-bottom:18px}.detailhead strong{font-size:14px}.changed{font-size:10px;color:#dbc481;padding:3px 6px;border:1px solid #6b5e3b;border-radius:4px}.detailhead small{margin-left:auto;color:var(--quiet);font-size:11px}table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}th{text-align:left;color:var(--quiet);font-size:11px;font-weight:500;padding:8px 5px;border-bottom:1px solid var(--line)}td{padding:10px 5px;overflow-wrap:anywhere}td:first-child{width:35%;color:var(--quiet)}.value{display:block;border-radius:4px;padding:4px 6px}.old{color:#ff9aab;background:#431c2a}.new{color:#62e6af;background:#153e31}.footer{font-size:11px;color:var(--quiet);border-top:1px solid var(--line);padding-top:10px;display:flex;justify-content:space-between;gap:8px}.skeleton{height:12px;border-radius:4px;background:#30313d;width:75%}.skeleton.short{width:45%}.skeleton.full{width:100%}.skeleton.value{height:27px}.placeholder .row-choice{border-color:var(--line);background:#1e1f28}.placeholder .detailhead{min-height:24px}.overlay{position:absolute;inset:0;background:#0e0f156e;display:grid;place-content:center;padding:20px;z-index:2}.overlay-box{padding:20px 24px;border:1px solid #494b66;border-radius:9px;background:#20212bea;box-shadow:0 12px 30px #0005;display:flex;flex-direction:column;align-items:center;gap:12px}.overlay-box strong{font-size:14px}.overlay-box p{font-size:12px;color:var(--quiet);margin:0}.alert{background:#381e27;border:1px solid #74374b;color:#ffb2c1;margin:12px 0;padding:10px;border-radius:6px;font-size:12px;line-height:1.6}.message{color:var(--quiet);font-size:12px;padding:10px 0;margin:0}.note{font-size:12px;line-height:1.65;color:var(--muted-foreground,#646473);margin:14px 0 0}.note strong{color:var(--foreground,#23232f)}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.spinner{animation:none}}@media(max-width:500px){.options button{min-width:135px;font-size:12px}.workbench{padding:16px}.sources{gap:8px;grid-template-columns:1fr 12px 1fr}.source{gap:6px}.source strong{font-size:11px}.unique{display:none}.inspector{grid-template-columns:90px 1fr}.rowlist{padding:8px}.detail{padding:10px 8px}.detailhead{gap:4px;flex-wrap:wrap}.detailhead small{display:none}.row-choice{padding:8px}.columns{gap:10px 12px}.content{min-height:430px}td,th{font-size:10px;padding:8px 3px}.value{padding:4px 3px}.footer{font-size:10px}.controls{gap:8px}.controls label{flex-wrap:wrap}.description{min-height:65px}.banner{margin-left:-16px;margin-right:-16px}}
</style>
<style>.options small{display:block;margin:3px 0 0}.options button{white-space:normal}@media(max-width:500px){.actions{gap:8px}.inline-progress{font-size:11px;gap:5px}.cancel{padding-inline:5px}}</style>
</head>
<body>
<nav class="options" aria-label="Transition options">
 <button data-option="a" aria-pressed="true">A · Quiet handoff <small>Recommended</small></button>
 <button data-option="b" aria-pressed="false">B · Results skeleton</button>
 <button data-option="c" aria-pressed="false">C · Progress overlay</button>
 <button data-option="current" aria-pressed="false">Current behavior</button>
</nav>
<p class="description" id="description"></p>
<div class="controls">
 <label>Timing <select id="timing"><option value="150">Fast · 150 ms</option><option value="1800">Slow · 1.8 s</option></select></label>
 <label>Start <select id="scenario"><option value="first">First comparison</option><option value="refresh">Existing result</option></select></label>
 <label>Outcome <select id="outcome"><option value="success">One changed row</option><option value="empty">No differences</option><option value="invalid">Invalid key</option><option value="error">Comparison fails</option></select></label>
 <button id="reset">Reset</button>
</div>
<section class="workbench" aria-label="CSV comparison prototype">
 <h2 class="mock-heading">Compare CSVs</h2>
 <div class="sources">
  <div class="source"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H5v18h14V8zM14 3v5h5M8 12h8M8 16h8M8 9h3"/></svg><div><strong>phase-2-sample-edited.csv</strong><small>Baseline</small></div></div>
  <span class="arrow" aria-hidden="true">→</span>
  <div class="source candidate"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H5v18h14V8zM14 3v5h5M8 12h8M8 16h8M8 9h3"/></svg><div><strong>phase-2-sample.csv</strong><small>Candidate</small></div></div>
 </div>
 <div id="content" class="content"></div>
</section>
<p class="note" id="note"></p>
<p class="note">Interactive prototype with simulated timing. Use <strong>Apply key</strong> or <strong>Refresh comparison</strong>; try Slow to see feedback and cancellation. CSV computation and row navigation are outside this prototype.</p>
<div class="sr-only" id="announcement" role="status" aria-live="polite"></div>
<script>
const descriptions={a:'Keep the key form—or the existing result—visible until the first result screen is complete. Slow operations get progress beside the action after 250 ms. Fast comparisons change screens once.',b:'Open the final results layout immediately, with static placeholders where the first row will appear. The geometry stays fixed as values replace the skeleton.',c:'Keep the current screen in place. After 250 ms, show a small progress overlay with Cancel. Replace the screen only when the first result is ready.',current:'Replay the observed sequence: key form → progress screen → empty results with “Loading rows…” → populated Inspector. Fast operations still show intermediate screens.'};
const notes={a:'<strong>Why A:</strong> Fast comparisons have no loading screen. Slow comparisons stay cancellable, and existing results remain readable. Requires loading the first row before revealing the new result; there is no minimum waiting time.',b:'<strong>Tradeoff:</strong> The result structure appears sooner, but even a fast comparison flashes a placeholder. On refresh this option temporarily replaces the existing values with a skeleton.',c:'<strong>Tradeoff:</strong> Slow operations get prominent feedback. The overlay dims the existing result, and adds a visual step. Fast comparisons follow the same single handoff as A.',current:'<strong>Observed:</strong> The sample comparison crossed these states in 120–214 ms. This replay approximates those transitions; it does not run the application.'};
const $=s=>document.querySelector(s);let option='a',busy=false,applied=false,phase='idle',feedback=false,message='',outcome='success',keys=['id'],timers=[],generation=0;
const spinner='<span class="spinner" aria-hidden="true"></span>';
function cancelTimers(){generation++;timers.forEach(clearTimeout);timers=[]}
function later(ms,fn){const run=generation;timers.push(setTimeout(()=>{if(run===generation)fn()},ms))}
function say(text){$('#announcement').textContent=text}
function reset(){cancelTimers();busy=false;applied=$('#scenario').value==='refresh';phase='idle';feedback=false;message='';outcome='success';keys=['id'];render()}
function editor(){return `<form id="key-form"><fieldset class="editor"><legend>Comparison Key</legend><div class="columns">${['id','name','email','signup_date','total_spend','status','notes','empty_field','weird column','$amount'].map(c=>`<label><input type="checkbox" ${keys.includes(c)?'checked':''} ${busy?'disabled':''} name="key" value="${c}">${c}</label>`).join('')}</div><div class="key-order"><small>KEY ORDER</small><span class="key-chip" id="key-order">${keys.map((k,i)=>`${i+1}. ${k}`).join(' + ')||'Choose a column'}</span></div><div class="actions">${action()}</div></fieldset></form>`}
function action(){return `<button class="primary" id="apply" ${busy||!keys.length?'disabled':''}>${applied?'Refresh comparison':'Apply key'}</button>${busy&&feedback&&(option==='a'||option==='b')?`<span class="inline-progress">${spinner} Comparing…</span><button type="button" class="cancel" id="cancel">Cancel</button>`:''}`}
function intro(){return `<div class="intro"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/></svg><h3>Choose a Comparison Key</h3><p>Select shared columns that uniquely identify rows in both files, then apply your key.</p></div>`}
function result(skeleton=false,loading=false){const empty=outcome==='empty'&&!skeleton&&!loading;return `<div class="match"><span class="quiet">Match rows by</span><code class="key-chip">id</code><span class="unique">${skeleton?'':'✓ Unique in both files'}</span></div><div class="badges">${[['Differences',empty?0:1],['All rows',5],['Changed',empty?0:1],['Baseline-only',0],['Candidate-only',0],['Unchanged',empty?5:4]].map(([label,count])=>`<span class="badge">${label}<b>${skeleton?'—':count}</b></span>`).join('')}</div><div class="viewbar"><span>Grid</span><strong>Inspector</strong><span>${loading?'Loading rows…':skeleton?'':empty?'':'Row 1 of 1'}</span></div>${empty?`<div class="intro"><h3 id="result-title" tabindex="-1">No differences</h3><p>All 5 rows are unchanged.</p></div>`:`<div class="inspector ${skeleton?'placeholder':''}"><div class="rowlist">${loading?'<span class="quiet">Loading rows…</span>':`<div class="row-choice">${skeleton?'<div class="skeleton full"></div><div class="skeleton short" style="margin-top:10px"></div>':'<strong>id 4</strong><small>Changed</small>'}</div>`}</div><div class="detail">${loading?'<div class="stage"><p>Loading a row to inspect…</p></div>':`<div class="detailhead">${skeleton?'<span class="skeleton short"></span>':'<strong id="result-title" tabindex="-1">id 4</strong><span class="changed">Changed</span><small>Row 1 of 1</small>'}</div><table><thead><tr><th>Field</th><th>Baseline</th><th>Candidate</th></tr></thead><tbody><tr><td>${skeleton?'<span class="skeleton full"></span>':'<code>total_spend</code>'}</td><td>${skeleton?'<span class="skeleton value full"></span>':'<span class="value old">− 1.0</span>'}</td><td>${skeleton?'<span class="skeleton value full"></span>':'<span class="value new">+ 1.5</span>'}</td></tr></tbody></table>`}</div></div>`}<div class="footer"><span>${loading?'Loading rows…':skeleton?'Preparing comparison…':empty?'5 of 5 rows':'1 of 5 rows'}</span><span>${skeleton?'':empty?'':'4 unchanged rows hidden'}</span></div>`}
function render(){
 $('#description').textContent=descriptions[option];$('#note').innerHTML=notes[option];document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.option===option));
 let html='';
 if(busy&&option==='b'){html=`<div class="actions" style="margin-bottom:12px">${action()}</div>`+result(true)}
 else if(busy&&option==='current'){
  if(phase==='rows')html=result(false,true);
  else html=(applied?result():editor())+`<div class="banner">${spinner}<strong>${phase}</strong><button class="cancel" id="cancel">Cancel</button></div>`+(applied?'':`<div class="stage">${spinner}<h3>${phase}</h3><p>No result will publish until the complete replacement is ready.</p></div>`);
 }else if(applied){html=`<div class="actions" style="margin-bottom:12px">${action()}</div>`+result()}
 else html=editor()+intro();
 if(message)html=`<p class="${phase==='error'?'alert':'message'}" ${phase==='error'?'role="alert"':''}>${message}</p>`+html;
 if(busy&&feedback&&option==='c')html+=`<div class="overlay"><div class="overlay-box">${spinner}<strong>Comparing CSVs…</strong><p>${applied?'Your current result is preserved.':'Preparing your comparison.'}</p><button class="cancel" id="cancel">Cancel</button></div></div>`;
 $('#content').innerHTML=html;$('#content').setAttribute('aria-busy',busy);
 const form=$('#key-form');if(form)form.addEventListener('submit',e=>{e.preventDefault();start()});else $('#apply')?.addEventListener('click',start);
 $('#cancel')?.addEventListener('click',cancel);
 document.querySelectorAll('input[name="key"]').forEach(input=>input.addEventListener('change',()=>{keys=[...document.querySelectorAll('input[name="key"]:checked')].map(c=>c.value);$('#apply').disabled=keys.length===0;$('#key-order').textContent=keys.map((k,i)=>`${i+1}. ${k}`).join(' + ')||'Choose a column'}));
}
function start(){if(busy)return;cancelTimers();busy=true;feedback=false;message='';phase='Validating key…';const duration=Number($('#timing').value);outcome=$('#outcome').value;say('Comparison started.');render();
 if(option==='current'){later(duration*.22,()=>{phase='Comparing complete CSVs…';render()});later(duration*.4,()=>{phase='Publishing result…';render()});if(outcome==='success'||outcome==='empty')later(duration*.68,()=>{phase='rows';render()})}
 else later(250,()=>{feedback=true;render();say('Comparing CSVs. Cancel is available.')});
 later(duration,()=>{busy=false;feedback=false;if(outcome==='invalid'||!keys.includes('id')){phase='error';message='This draft is not a Valid Comparison Key. Choose id to uniquely match the sample rows, then retry.'}else if(outcome==='error'){phase='error';message=`Comparison failed. Try again.${applied?' Your previous result was preserved.':''}`}else{applied=true;phase='done'}render();say(message||'Comparison ready.');(message?$('#apply'):$('#result-title'))?.focus()});
}
function cancel(){if(!busy)return;cancelTimers();busy=false;feedback=false;phase='idle';message=applied?'Comparison cancelled. Your previous result was preserved.':'Comparison cancelled. No result was applied.';render();say(message);$('#apply')?.focus()}
document.querySelectorAll('[data-option]').forEach(button=>button.addEventListener('click',()=>{option=button.dataset.option;reset()}));['timing','scenario','outcome'].forEach(id=>$('#'+id).addEventListener('change',reset));$('#reset').addEventListener('click',reset);document.addEventListener('keydown',event=>{if(event.key==='Escape'&&busy){event.preventDefault();cancel()}});render();
</script>
</body>
</html>
